---
# Use includes to avoid a lot of skipped tasks
# Also, this seems to make the handlers for systemd services work (?!)
- name: Configure, enable and start the Mopidy systemd services
  when: mopidy_active
  tags:
  - activate
  include_tasks:
    file: activate.yml

- name: Stop, disable and remove customisation for Mopidy systemd services
  when: not mopidy_active
  tags:
  - deactivate
  include_tasks:
    file: deactivate.yml
