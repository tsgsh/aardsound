---
# Use includes to avoid a lot of skipped tasks
- name: Configure, enable and start the multi-room Bluetooth systemd services
  when: bluetooth_multiroom_active
  tags:
  - activate
  include_tasks:
    file: activate.yml

- name: Stop, disable and remove customisation for multi-room Bluetooth systemd services
  when: not bluetooth_multiroom_active
  tags:
  - deactivate
  include_tasks:
    file: deactivate.yml
