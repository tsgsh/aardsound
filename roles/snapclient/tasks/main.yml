---
# Use includes to avoid a lot of skipped tasks
- name: Configure, enable and start the Snapcast client systemd services
  when: snapclient_active
  tags:
  - activate
  include_tasks:
    file: activate.yml

- name: Stop, disable and remove customisation for Snapcast client systemd services
  when: not snapclient_active
  tags:
  - deactivate
  include_tasks:
    file: deactivate.yml
