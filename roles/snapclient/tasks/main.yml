---
# Use includes to avoid a lot of skipped tasks
- name: Configure, enable and start snapclient(s)
  when: snapclient_active
  tags:
  - activate
  include_tasks:
    file: activate.yml

- name: Remove the systemd snapclient service(s)
  when: not snapclient_active
  tags:
  - deactivate
  include_tasks:
    file: deactivate.yml
