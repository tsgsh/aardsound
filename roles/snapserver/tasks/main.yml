---
# Use includes to avoid a lot of skipped tasks
# Also, this seems to make the handlers for systemd services work (?!)
- name: "Configure, enable and start {{ snapserver_service }}"
  when: snapserver_active
  tags:
  - activate
  include_tasks:
    file: activate.yml

- name: "Remove the systemd service {{ snapserver_service }}"
  when: not snapserver_active
  tags:
  - deactivate
  include_tasks:
    file: deactivate.yml
