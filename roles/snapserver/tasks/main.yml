---
# Use includes to avoid a lot of skipped tasks
# Also, this seems to make the handlers for systemd services work (?!)
- name: Configure, enable and start the the Snapcast server systemd service
  when: snapserver_active
  tags:
  - activate
  include_tasks:
    file: activate.yml

- name: Stop, disable and Remove the configuration for the Snapcast server systemd service
  when: not snapserver_active
  tags:
  - deactivate
  include_tasks:
    file: deactivate.yml
