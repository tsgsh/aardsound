---
# Use includes to avoid a lot of skipped tasks
- name: Configure, enable and start the multi-room Spotify systemd services
  when: spotify_multiroom_active
  tags:
  - activate
  include_tasks:
    file: activate.yml

- name: Stop, disable and remove the configuration for the multi-room Spotify systemd services
  when: not spotify_multiroom_active
  tags:
  - deactivate
  include_tasks:
    file: deactivate.yml
