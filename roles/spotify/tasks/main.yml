---
# Use includes to avoid a lot of skipped tasks
# Also, this seems to make the handlers for systemd services work (?!)
- name: Configure, enable and start the Spotify systemd services
  when: spotify_active
  tags:
  - activate
  include_tasks:
    file: activate.yml

- name: Stop, disable and remove the configuration for the Spotify systemd services
  when: not spotify_active
  tags:
  - deactivate
  include_tasks:
    file: deactivate.yml
