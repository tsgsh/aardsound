---
# Use includes to avoid a lot of skipped tasks
# Also, this seems to make the handlers for systemd services work (?!)
- name: "Configure, enable and start {{ spotify_service }}"
  when: spotify_active
  tags:
  - activate
  include_tasks:
    file: activate.yml

- name: "Remove systemd service {{ spotify_service }}"
  when: not spotify_active
  tags:
  - deactivate
  include_tasks:
    file: deactivate.yml
