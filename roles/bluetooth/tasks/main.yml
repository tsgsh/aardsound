---
# Use includes to avoid a lot of skipped tasks
# Also, this seems to make the handlers for systemd services work (?!)
- name: Configure, enable and start the Bluetooth systemd services
  when: bluetooth_active
  tags:
  - activate
  include_tasks:
    file: activate.yml

- name: Stop, disable and remove customisation for Bluetooth systemd services
  when: not bluetooth_active
  tags:
  - deactivate
  include_tasks:
    file: deactivate.yml
