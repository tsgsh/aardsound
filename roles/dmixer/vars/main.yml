---
# vars file for aardsound_dmixer
dmixer_conf_file: /etc/asound.conf
dmixer_template_file: asound.conf.j2
dmixer_asound_snippet_state: "{{ 'present' if dmixer_active else 'absent' }}"
dmixer_asound_snippet_verb: "{{ 'Create' if dmixer_active else 'Remove' }}"
dmixer_period_size: "{{ dmixer_rate * dmixer_period_time / 1000000 }}"
dmixer_buffer_size: "{{ dmixer_period_size * dmixer_periods }}"
